slug: freshrss
popularity: 55
tenant_installable: true
name: FreshRSS
tags: ["Productivity"]
version: "1.30.0"
description: |
  Self-hosted RSS / Atom feed aggregator. Lightweight, extensible
  via plugins, multi-user. Single container, SQLite by default.
icon: icon.svg
upstream: https://github.com/FreshRSS/FreshRSS
documentation: https://freshrss.github.io/FreshRSS/

image_channel: freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
update_mode: manual

resources:
  cpu: "0.5"
  memory: "256m"
  pids: 100

volumes:
  - name: data
    container_path: /var/www/FreshRSS/data
  - name: extensions
    container_path: /var/www/FreshRSS/extensions

ports:
  - name: http
    container_port: 80
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /

env:
  - name: TZ
    value: "UTC"
  - name: CRON_MIN
    value: "*/20"
