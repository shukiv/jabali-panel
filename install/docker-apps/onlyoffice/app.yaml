slug: onlyoffice
popularity: 44
name: ONLYOFFICE Docs
tags: ["Productivity", "File sharing"]
version: "10.0.0.1"
# Release track (GH #1956): new installs get ONLYOFFICE Docs 10. Update keeps
# a 9.x install on its own 9.4.0 image and says why. The 10 Community image
# starts no PostgreSQL, RabbitMQ or Redis (run-document-server.sh starts them
# only when PRODUCT_EDITION is set), so an in-place move would leave a 9.x
# install's bundled state unread. Moving 9 to 10 needs a reviewed change after
# a box upgrade test.
track: "10"
description: >-
  ONLYOFFICE Document Server: online editors for documents, spreadsheets, and
  presentations (OOXML-native), used standalone or as the editing backend for
  Nextcloud, Seafile, and others. Single container; 9.x installs bundle their
  own datastore, new 10 installs start none.
  JWT request-signing is enabled with a generated secret (JWT_SECRET in the
  install .env) — set the same secret in any app that connects to it.
icon: icon.svg
upstream: https://github.com/ONLYOFFICE/DocumentServer
documentation: https://helpcenter.onlyoffice.com/installation/docs-developer-index.aspx

image_channel: onlyoffice/documentserver:10.0.0.1@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
held_tracks:
  - track: "9"
    version: "9.4.0"
    image_channel: onlyoffice/documentserver:9.4.0@sha256:e3da62a847b9a5d51a11f73cfea1d9c13c3be3809614490d4edddcf01dcf919b
update_mode: manual

resources:
  cpu: "2.0"
  memory: "2g"
  pids: 500

# The 9.x documentserver image bundles its own postgres/rabbitmq/redis; the 10
# image starts none of them. Both run the entrypoint as root, chowning their
# data dirs on start — no volume_owner. The db volume stays for 9.x installs.
volumes:
  - name: data
    container_path: /var/www/onlyoffice/Data
  - name: lib
    container_path: /var/lib/onlyoffice
  - name: db
    container_path: /var/lib/postgresql
  - name: logs
    container_path: /var/log/onlyoffice
    rotate:
      retention_days: 14
      max_size: 50M
      mode: copytruncate

ports:
  - name: http
    container_port: 80
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /healthcheck

env:
  - name: JWT_SECRET
    secret: true
    generate: password64
