slug: odoo
popularity: 42
name: Odoo
tags: ["ERP", "CRM"]
version: "20.0"
# Release track (GH #1956): Odoo 20 is for new installs. Odoo can't open an
# older major's database without a migration, so Update keeps a 19 or 18
# install on its own major and says why.
track: "20"
description: >-
  Open-source ERP and business suite: CRM, accounting, inventory, sales,
  projects, and a website builder from one platform. Two services here: the
  Odoo server and a PostgreSQL store; the server runs with --proxy-mode behind
  the panel's TLS vhost. On first visit you create the database and admin user.
  Note: the database-manager master password defaults to 'admin' — change it
  immediately from the database manager.
icon: icon.svg
upstream: https://github.com/odoo/odoo
documentation: https://www.odoo.com/documentation/20.0/

image_channel: odoo:20.0@sha256:cdd83e8359b3e8c357895d476396c05021fed9975bf420f353bab25fcaed1533
held_tracks:
  - track: "19"
    version: "19.0"
    image_channel: odoo:19.0@sha256:dd9013e669caaa23d26765dc55814655eaeecca7cfc2c265dbabae913bce22fd
  - track: "18"
    version: "18.0"
    image_channel: odoo:18.0@sha256:60eb1b5006df85f900e300b6cc120d51ebd979379ee9588340adc2a84ffcd718
update_mode: manual

resources:
  cpu: "2.0"
  memory: "1g"
  pids: 300

# Odoo's container process is uid 100, gid 101 (the image's /var/lib/odoo is
# owned 100:101). The install-time chown sets BOTH volume subdirs to 100:101;
# Postgres's own root entrypoint re-chowns its PGDATA on first init, so the
# shared owner is safe for the db volume. (101:101 EACCESed on
# /var/lib/odoo/sessions — caught in the live VM smoke.)
volume_owner: "100:101"

volumes:
  - name: odoo-data
    container_path: /var/lib/odoo
  - name: postgres
    container_path: /var/lib/postgresql/data

ports:
  - name: http
    container_port: 8069
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /web/health

env:
  - name: POSTGRES_PASSWORD
    secret: true
    generate: password32
