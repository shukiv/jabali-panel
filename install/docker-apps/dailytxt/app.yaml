slug: dailytxt
tenant_installable: true
name: DailyTxt
tags: ["Productivity"]
version: "2.6.3"
description: |
  Self-hosted, end-to-end encrypted diary application. Plain text +
  attachments, fully encrypted client-side. Single container with
  file-system storage.
icon: icon.svg
upstream: https://github.com/PhiTux/DailyTxt
documentation: https://github.com/PhiTux/DailyTxt#readme

image_channel: phitux/dailytxt:2.6.3@sha256:87f023301497aefd2432449aa3f4ece9c4e98a466d17f423ce0cfd1fc964aca9
update_mode: manual

resources:
  cpu: "0.5"
  memory: "256m"
  pids: 200

volumes:
  - name: data
    container_path: /app/data

ports:
  - name: http
    container_port: 80
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /

env:
  - name: SECRET_TOKEN
    secret: true
    generate: password64
  - name: ALLOW_REGISTRATION
    value: "true"
  - name: ADMIN_PASSWORD
    secret: true
    generate: password32
