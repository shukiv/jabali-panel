slug: forgejo
popularity: 70
name: Forgejo
tags: ["Developer tools"]
version: "15.0.3"
description: |
  Lightweight self-hosted Git forge — a community-run fork of Gitea.
  Bundled SQLite for v1; admin can flip to compose-managed Postgres
  post-install. Two ports: HTTP for the web UI (reverse-proxied) and
  SSH for git-over-ssh (binds to a public IP, no nginx in the path).
icon: icon.svg
upstream: https://codeberg.org/forgejo/forgejo
documentation: https://forgejo.org/docs/

image_channel: codeberg.org/forgejo/forgejo:15.0.3@sha256:55bb42bec9abef5223744804f164e37d37b20df7e8b8b4807ba213ad4f071d6d
volume_owner: "1000:1000"
update_mode: manual

resources:
  cpu: "1.0"
  memory: "512m"
  pids: 500

volumes:
  - name: data
    container_path: /data
  - name: config
    container_path: /etc/gitea

ports:
  - name: http
    container_port: 3000
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /api/healthz
  - name: ssh
    container_port: 22
    protocol: tcp
    default_enabled: false
    default_bind: public
    default_reverse_proxy: false

env:
  - name: USER_UID
    value: "1000"
  - name: USER_GID
    value: "1000"

# Operator-supplied SMTP (GH #322): auto-injects standard SMTP_* install fields;
# compose maps them to this app's SMTP env.
smtp: true
