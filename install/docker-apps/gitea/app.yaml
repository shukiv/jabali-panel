slug: gitea
popularity: 82
name: Gitea
tags: ["Developer tools"]
version: "1.26.2"
description: |
  Lightweight self-hosted Git service. Bundled SQLite for v1; admin
  can flip to compose-managed Postgres post-install. Two ports: HTTP
  for the web UI (reverse-proxied) and SSH for git-over-ssh (binds
  to a public IP, no nginx in the path).
icon: icon.svg
upstream: https://github.com/go-gitea/gitea
documentation: https://docs.gitea.com/

image_channel: gitea/gitea:1.26@sha256:8e25c717b8f748445e15ec46e0390f577cb628101184cb0a150d1dae126c1f39
volume_owner: "1000:1000"
update_mode: manual

resources:
  cpu: "1.0"
  memory: "512m"
  pids: 500

volumes:
  - name: data
    container_path: /data
  - name: config
    container_path: /etc/gitea

ports:
  - name: http
    container_port: 3000
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /api/healthz
  - name: ssh
    container_port: 22
    protocol: tcp
    default_enabled: false
    default_bind: public
    default_reverse_proxy: false

env:
  - name: USER_UID
    value: "1000"
  - name: USER_GID
    value: "1000"

# Operator-supplied SMTP (GH #322): auto-injects standard SMTP_* install fields;
# compose maps them to this app's SMTP env.
smtp: true
