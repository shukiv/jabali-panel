slug: enclosed
tenant_installable: true
name: Enclosed
tags: ["Developer tools"]
version: "1.16.0"
description: |
  Minimalist, open-source web app for sending private and encrypted
  notes and files. Zero-knowledge: content is end-to-end encrypted in
  the browser before upload, with optional password, expiration, and
  read-once (burn-after-reading). Single container, filesystem storage
  by default — no external database.
icon: icon.svg
upstream: https://github.com/CorentinTh/enclosed
documentation: https://docs.enclosed.cc

# Stable tag; the panel pins the digest at install time and tracks
# updates separately (update_mode: manual).
image_channel: corentinth/enclosed:1.16.0@sha256:d1e78c34ae7027c0c7b7a9ba67f352520049b9f260560fb8a0b3b1c55488cdc8
update_mode: manual

resources:
  cpu: "0.5"
  memory: "256m"
  pids: 200

volumes:
  - name: data
    container_path: /app/.data

ports:
  - name: http
    container_port: 8787
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /
