slug: n8n
popularity: 88
name: n8n
tags: ["Automation", "Developer tools"]
version: "2.28.2"
description: |
  Workflow automation tool. Build, run, and share workflows that
  connect APIs, databases, and services. Self-hosted, single
  container, SQLite by default.
icon: icon.svg
upstream: https://github.com/n8n-io/n8n
documentation: https://docs.n8n.io/

image_channel: n8nio/n8n:2.28.2@sha256:08b9411994c0d091c5cc0969ee9edcb85b5e79f26640703c0c342076ac6f2b17
update_mode: manual

# The image runs as node (uid 1000); without volume_owner the bind-mounted
# data dir stays owned by container-root and n8n crash-loops on
# EACCES /home/node/.n8n/config under docker userns-remap.
volume_owner: "1000:1000"

resources:
  cpu: "1.0"
  # n8n 2.x does not survive startup module loading inside 512m — V8 dies
  # with "Ineffective mark-compacts near heap limit" before first listen.
  memory: "1024m"
  pids: 200

volumes:
  - name: data
    container_path: /home/node/.n8n

ports:
  - name: http
    container_port: 5678
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /healthz

env:
  - name: N8N_HOST
    value: "0.0.0.0"
  - name: WEBHOOK_URL
    value: ""
  - name: GENERIC_TIMEZONE
    value: "UTC"

# Operator-supplied SMTP (GH #322): auto-injects standard SMTP_* install fields;
# compose maps them to this app's SMTP env.
smtp: true
