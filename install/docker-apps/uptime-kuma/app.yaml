slug: uptime-kuma
popularity: 85
tenant_installable: true
name: Uptime Kuma
tags: ["Monitoring"]
version: "2.4.0"
description: |
  Self-hosted monitoring tool, single container, status pages,
  multi-protocol probes (HTTP/HTTPS, TCP, ping, DNS, push). Minimal
  resource footprint, runs on SQLite.
icon: icon.svg
upstream: https://github.com/louislam/uptime-kuma
documentation: https://github.com/louislam/uptime-kuma/wiki

image_channel: louislam/uptime-kuma:2@sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
update_mode: manual

resources:
  cpu: "0.5"
  memory: "256m"
  pids: 200

volumes:
  - name: data
    container_path: /app/data

ports:
  - name: http
    container_port: 3001
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /
