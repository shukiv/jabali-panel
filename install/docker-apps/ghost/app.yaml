slug: ghost
name: Ghost
tags: ["Blog", "CMS"]
version: "6.44.1"
description: |
  Modern publishing platform. SQLite by default; the operator can
  switch to MySQL by editing the compose post-install. Single
  container, persistent /var/lib/ghost/content.
icon: icon.png
upstream: https://github.com/TryGhost/Ghost
documentation: https://ghost.org/docs/

image_channel: ghost:6-alpine@sha256:dc932c22add1906101fc034450392dbea107488b0ca191bb91cc0b2a667d652b
update_mode: manual
tenant_installable: true

resources:
  cpu: "1.0"
  memory: "512m"
  pids: 200

volumes:
  - name: content
    container_path: /var/lib/ghost/content

ports:
  - name: http
    container_port: 2368
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /

env:
  - name: NODE_ENV
    value: "production"
  - name: database__client
    value: "sqlite3"
  - name: database__connection__filename
    value: "/var/lib/ghost/content/data/ghost.db"
  - name: database__useNullAsDefault
    value: "true"

# Operator-supplied SMTP (GH #322): auto-injects standard SMTP_* install fields;
# compose maps them to this app's SMTP env.
smtp: true
