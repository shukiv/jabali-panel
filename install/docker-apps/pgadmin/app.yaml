slug: pgadmin
popularity: 40
name: pgAdmin
tags: ["Developer tools", "Database"]
version: "9.16"
description: |
  Web-based administration and management tool for PostgreSQL. Browse
  schemas, run queries, manage roles and backups from the browser. Admin
  tool — install it server-level and point it at your PostgreSQL servers
  (credentials are entered in pgAdmin, not passed automatically).
icon: icon.svg
upstream: https://www.pgadmin.org/
documentation: https://www.pgadmin.org/docs/

# Pinned to 9.16, NOT 9.17: the 9.17 image crash-loops on boot with
# "ssl.py ... ValueError: Unknown object" (a broken OID table in that build) —
# box-verified on a real host. 9.16 boots and serves /misc/ping. Re-verify a
# container actually starts before bumping this pin.
image_channel: dpage/pgadmin4:9.16@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
update_mode: manual

# pgAdmin runs as the unprivileged "pgadmin" user (uid/gid 5050) and reads
# its SQLite config store from the bind-mounted volume on first launch; the
# agent chowns the volume dir to 5050 so it doesn't crash-loop on EACCES.
volume_owner: "5050:5050"

resources:
  cpu: "0.5"
  memory: "512m"
  pids: 200

volumes:
  - name: data
    container_path: /var/lib/pgadmin

ports:
  - name: http
    container_port: 8080
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /misc/ping

env:
  # Login for the pgAdmin web UI. Override the email at install time; the
  # password is auto-generated and stored in the app's .env (0600), masked
  # in the panel.
  - name: PGADMIN_DEFAULT_EMAIL
    value: "admin@example.com"
  - name: PGADMIN_DEFAULT_PASSWORD
    secret: true
    generate: password32

post_install_note: |
  Open https://{{domain}} and sign in with PGADMIN_DEFAULT_EMAIL (default
  admin@example.com) and the generated password (see this app's env). Then
  add a server connection: for a PostgreSQL container on this host use the
  "host.docker.internal" hostname; enter the database credentials yourself
  (pgAdmin does not receive them from the panel).
