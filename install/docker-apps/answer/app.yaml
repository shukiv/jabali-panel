slug: answer
name: Apache Answer
tags: ["Forum"]
version: "2.0.3"
description: |
  Open-source Q&A platform (Stack Overflow-style) from the Apache Software
  Foundation. Questions, answers, voting, tags, reputation, badges, and admin
  moderation. Single container with SQLite by default; the first visit opens a
  web setup wizard to create the database and the admin account.
icon: icon.svg
upstream: https://github.com/apache/answer
documentation: https://answer.apache.org/

image_channel: apache/answer:2.0.3@sha256:0863470d8293294b899f8b39a373df6d6250c3f3e412ea0e483924b41e23428f
update_mode: manual
tenant_installable: true

resources:
  cpu: "0.5"
  memory: "512m"
  pids: 200

volumes:
  - name: data
    container_path: /data

ports:
  - name: http
    container_port: 80
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /
