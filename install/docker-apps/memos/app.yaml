slug: memos
popularity: 34
tenant_installable: true
name: Memos
tags: ["Productivity"]
version: "26.10.0"
description: |
  Self-hosted, open-source note-taking platform. Lightweight, single
  container with SQLite by default. Markdown editor, tagging,
  daily review, multi-user support.
icon: icon.svg
upstream: https://github.com/usememos/memos
documentation: https://www.usememos.com/docs

image_channel: neosmemo/memos:26.10.0@sha256:fbc6ef8e9e0b377377f0d71d426d6192a9a0f08a8e3e35bec3557a43f4399260
update_mode: manual

resources:
  cpu: "0.5"
  memory: "256m"
  pids: 200

volumes:
  - name: data
    container_path: /var/opt/memos

ports:
  - name: http
    container_port: 5230
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /healthz
