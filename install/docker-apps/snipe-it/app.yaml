slug: snipe-it
name: Snipe-IT
tags: ["IT", "Inventory", "Assets"]
version: "8.7.2"
description: |
  Free, open-source IT asset management. Track hardware, licenses,
  accessories, and consumables. Laravel app container + bundled MariaDB.
icon: icon.webp
upstream: https://github.com/snipe/snipe-it
documentation: https://snipe-it.readme.io/docs

image_channel: snipe/snipe-it:v8.7.2@sha256:18cc45da877ec5509e1fdb17b492db42e37d3ca3bc89d885d82e9c0ecdae1253
update_mode: manual

resources:
  cpu: "1.5"
  memory: "768m"
  pids: 300

volumes:
  - name: data
    container_path: /var/lib/snipeit
  - name: db
    container_path: /var/lib/mysql

ports:
  - name: http
    container_port: 80
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /

env:
  - name: APP_KEY
    secret: true
    generate: laravel_key
  - name: DB_PASSWORD
    secret: true
    generate: password32
  - name: MYSQL_ROOT_PASSWORD
    secret: true
    generate: password32

# Operator-supplied SMTP (GH #322): auto-injects standard SMTP_* install fields;
# compose maps them to this app's SMTP env.
smtp: true
