# Managed by jabali install.sh (GH #2543). Same shape as
# jabali-kratos-flow-bf.yaml.
#
# Mailbox password page brute force: each parsed event is a POST to
# /mailbox-password the panel already THROTTLED, i.e. an address guessing
# mailbox passwords past the per-address limit. A handful from one address =
# a persistent guesser -> ban.
type: leaky
name: jabali/mailbox-password-bf
description: "Detect password guessing on the mailbox password page (panel-throttled)"

filter: evt.Meta.log_type == 'mailbox_password_rate_limited'

groupby: evt.Meta.source_ip

# 5 throttle-hits within the window -> ban. These lines only appear once an
# address is ALREADY over the panel's rate limit, so the threshold is low.
leakspeed: "30s"
capacity: 5

blackhole: "1m"

labels:
  service: jabali-panel
  type: bruteforce
  remediation: true
  confidence: 3
  spoofable: 0
