# Managed by jabali install.sh (GH #2543).
# Parse the mailbox password page's rate-limit marker. panel-api throttles
# POST /mailbox-password (served on the mail hostnames) per client address
# and logs, per throttled request:
#
#   JSON  (production): {"time":...,"level":"WARN","msg":"mailbox password change rate limited",
#                        "marker":"mailbox_password_rate_limited","client_ip":"1.2.3.4"}
#   text  (LOG_FORMAT=text): time=... level=WARN msg="mailbox password change rate limited"
#                        marker=mailbox_password_rate_limited client_ip=1.2.3.4
#
# Only the per-address marker is parsed. The per-mailbox one
# (mailbox_password_account_rate_limited) is left alone on purpose: the
# mailbox's owner retrying while someone else guesses must not be banned.
# Same shape as jabali-panel-kratos.yaml: filter on the marker substring,
# grok the client_ip in either rendering.
name: jabali/panel-mailbox-password
description: "Parse jabali-panel mailbox password page rate-limit markers from journalctl"

filter: "evt.Line.Labels.type == 'jabali-panel' && evt.Line.Raw contains 'mailbox_password_rate_limited'"
onsuccess: next_stage
nodes:
  - grok:
      pattern: 'client_ip"?\s*[=:]\s*"?%{IP:client_ip}"?'
      apply_on: Line.Raw

statics:
  - meta: service
    value: jabali-panel
  - meta: source_ip
    expression: evt.Parsed.client_ip
  - meta: log_type
    value: mailbox_password_rate_limited
