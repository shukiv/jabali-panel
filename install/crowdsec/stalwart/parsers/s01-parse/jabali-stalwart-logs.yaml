# Managed by jabali install.sh — adapted from
# https://github.com/bu5hm4nn/crowdsec-stalwart parsers/s01-parse/stalwart-logs.yaml
# MIT-licensed; see install/crowdsec/stalwart/LICENSE and UPSTREAM.md.
#
# Changes vs. upstream:
#   - Renamed `stalwart-logs` -> `jabali/stalwart-logs` so it cohabits
#     cleanly with any hub-installed CrowdSec parser of the same name.
#   - Switched the source filter from `evt.Parsed.program == 'stalwart'`
#     (assumes file-tail through a syslog stage) to
#     `evt.Line.Labels.type == 'stalwart'` so this works with the
#     journalctl acquisition path jabali uses (Stalwart writes
#     structured lines to stdout, systemd captures them, CrowdSec
#     reads them via the journal acquis below).
#   - Grok now applies to Line.Raw directly — no intermediate syslog
#     stage required.
#   - Protocol-mapping reflects the listenerId names jabali sets in
#     its Stalwart apply plan (smtp-25, smtp-submissions-465,
#     smtp-submission-587, imaps, internal-loopback) — not the bu5hm4nn
#     upstream sample names ("smtp", "submission", "submissions").
#   - The client address is read only where Stalwart itself puts it, and
#     the line is dropped when it is not there (see below). The other
#     fields are read one by one, wherever they sit.
#
# Where the client address is. Every scenario bans `remoteIp`, so it must
# never come from text a client sent. Quoted values (login name, EHLO domain,
# sender address, URL path) can hold any text the client chose, so the parser
# never relies on quotes to tell a key from a value. The address is taken from
# a fixed position only, inside the root pattern:
#   - right after `listenerId = "…", localPort = N, ` at the start of the
#     list. Stalwart writes these first, before any client text. This is
#     where 0.16 puts it on every event, and 1.0 on every event seen so far
#     except auth.failed;
#   - for auth.failed only, at the very end: `, remoteIp = IP, id = "…"`.
#     1.0 writes an auth failure as `listenerId, localPort, remotePort,
#     reason, accountName, causedBy, remoteIp, id`. The client's text sits
#     before causedBy, and the line ends where Stalwart ends it: it writes a
#     newline in a value as the two characters `\n` (seen on 0.16.27).
# A line without the address at one of these places is dropped, as lines
# without any address always were. The header is pinned the same way: the
# message has no parentheses and the event name has no spaces, so the event
# is always Stalwart's and the list always starts right after it.
#
# The root's own pattern must hold the address rule: once the root's grok
# matches, the root succeeds whatever its children do. Its one child is a
# wrapper whose children each read one more field; those can come from client
# text, but they only describe the client's own line (the address is fixed).
# A node set to `onsuccess: next_stage` stops at its first successful child,
# so the root (which must stay `next_stage`: with `continue` the event never
# leaves s01-parse) has that single child, and the wrapper keeps the default
# `continue` so every field node runs.

name: jabali/stalwart-logs
description: "Parse jabali-stalwart structured logs from journalctl"

filter: "evt.Line.Labels.type == 'stalwart'"
onsuccess: next_stage
pattern_syntax:
  # Optional syslog-style prefix: journal source (jabali-stalwart acquis ->
  # systemd journalctl) hands lines like
  #   `Jun 03 23:29:26 puzzle.example stalwart[1234]: <message>`
  # to the parser; file-source / cscli explain hand the message directly.
  STALWART_PREFIX: '(?:[A-Z][a-z]{2}\s+\d+\s+\d{2}:\d{2}:\d{2}\s+\S+\s+\S+:\s+)?'
  STALWART_MESSAGE: '[^()]*'
  STALWART_EVENT: '[a-z0-9][a-z0-9.-]*'
  STALWART_TAIL_EVENT: 'auth\.failed'
  STALWART_FRONT_IP: '(?:listenerId = "[^"]*", )?localPort = \d+, remoteIp = "?%{IP:ip_front}"?(?:, .*)?'
  STALWART_TAIL_IP: '.*, remoteIp = "?%{IP:ip_tail}"?, id = "[A-Za-z0-9]+"'
grok:
  pattern: '^%{STALWART_PREFIX}%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level} %{STALWART_MESSAGE:message} \((?:%{STALWART_EVENT:event}\) %{STALWART_FRONT_IP}|%{STALWART_TAIL_EVENT:event_tail}\) %{STALWART_TAIL_IP})$'
  apply_on: Line.Raw
nodes:
  - nodes:
      - grok:
          pattern: '(?:\) |, )listenerId = "?%{DATA:listenerId}"?(?:,|$)'
          apply_on: Line.Raw
      - grok:
          pattern: '(?:\) |, )localPort = %{INT:localPort}(?:,|$)'
          apply_on: Line.Raw
      - grok:
          pattern: '(?:\) |, )remotePort = %{INT:remotePort}(?:,|$)'
          apply_on: Line.Raw
      - grok:
          pattern: '(?:\) |, )accountName = "%{DATA:accountName}"(?:,|$)'
          apply_on: Line.Raw
      - grok:
          pattern: '(?:\) |, )domain = "%{DATA:domain}"(?:,|$)'
          apply_on: Line.Raw
      # http-scan matches on details and path.
      - grok:
          pattern: '(?:\) |, )details = "%{DATA:details}"(?:,|$)'
          apply_on: Line.Raw
      - grok:
          pattern: '(?:\) |, )path = "%{DATA:path}"(?:,|$)'
          apply_on: Line.Raw

statics:
  # These two first: the statics below and every scenario read them.
  - parsed: event
    expression: 'evt.Parsed.event != "" ? evt.Parsed.event : evt.Parsed.event_tail'

  - parsed: remoteIp
    expression: 'evt.Parsed.ip_front != "" ? evt.Parsed.ip_front : evt.Parsed.ip_tail'

  - meta: service
    value: stalwart

  - meta: source_ip
    expression: evt.Parsed.remoteIp

  - meta: log_type
    expression: evt.Parsed.event

  - meta: log_level
    expression: evt.Parsed.log_level

  - meta: listener_id
    expression: evt.Parsed.listenerId

  - meta: account_name
    expression: evt.Parsed.accountName

  - meta: domain
    expression: evt.Parsed.domain

  - parsed: remote_port
    expression: evt.Parsed.remotePort

  - parsed: local_port
    expression: evt.Parsed.localPort

  # Map jabali listenerId names to a stable protocol token the
  # scenarios can filter on. jabali ships these listener IDs out of
  # its Stalwart apply plan; matching them up explicitly is more
  # readable than a regex.
  - meta: protocol
    expression: |
      evt.Parsed.listenerId in ["smtp-25", "smtp-submissions-465", "smtp-submission-587"] ? "smtp" :
      evt.Parsed.listenerId in ["imaps", "imap", "imaptls"] ? "imap" :
      evt.Parsed.listenerId == "internal-loopback" ? "http" :
      evt.Parsed.listenerId == "sieve" ? "managesieve" :
      "unknown"

  - target: evt.StrTime
    expression: evt.Parsed.timestamp
