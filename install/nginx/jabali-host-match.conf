# Managed by jabali: installed by ensure_nginx_host_match (install.sh) and
# refreshed on every `jabali update`. Local edits are overwritten.
#
# Refuse a request whose Host header names a different host from the one
# nginx serves it for.
#
# An HTTP/1.1 request may carry its host in the request line
# ("GET http://example.com/ HTTP/1.1"). nginx then picks the server block,
# and sets $host, from the request line and ignores the Host header, while
# the CrowdSec bouncer and the applications behind nginx read the Host
# header. A client must send a Host equal to the request line's host
# (RFC 9112, section 3.2), so a request where they differ gets 400.
# HTTP/2 needs no check: nginx turns :authority into the Host header and
# refuses a request that carries both.
#
# The Host header is compared in the form nginx derives $host from it:
# lower-cased, without the port and without one trailing dot; an IPv6
# literal keeps its brackets. A request with no Host header (HTTP/1.0)
# passes.
#
# This is Lua, so it needs the module the CrowdSec nginx bouncer loads; the
# installer writes it only where /etc/nginx/conf.d/crowdsec_nginx.conf
# exists. It runs in the rewrite phase, before the bouncer's access phase.
# A server or location with its own rewrite_by_lua* replaces it there.
rewrite_by_lua_block {
    if ngx.is_subrequest then
        return
    end
    local hdr = ngx.var.http_host
    if hdr == nil or hdr == "" then
        return
    end
    local h = string.lower(hdr)
    if string.sub(h, 1, 1) == "[" then
        local e = string.find(h, "]", 1, true)
        if e then
            h = string.sub(h, 1, e)
        end
    else
        local c = string.find(h, ":", 1, true)
        if c then
            h = string.sub(h, 1, c - 1)
        end
    end
    if string.sub(h, -1) == "." then
        h = string.sub(h, 1, -2)
    end
    if h ~= ngx.var.host then
        return ngx.exit(ngx.HTTP_BAD_REQUEST)
    end
}
