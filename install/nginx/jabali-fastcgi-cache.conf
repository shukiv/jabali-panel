# Managed by jabali — ADR-0108 per-domain FastCGI micro-cache.
# DO NOT hand-edit; re-applied by install.sh + `jabali update`.
#
# ONE shared keyzone. Per-domain vhosts opt in with
# `fastcgi_cache jabali_fcgi;` (rendered by panel-agent domain.create
# only when the domain's cache_enabled is true). This http-context
# directive MUST be loaded before any vhost references the zone or
# `nginx -t` fails — that is why `jabali update` re-applies it (the
# "jabali update doesn't refresh host config" scar, PR#45/#49).
fastcgi_cache_path /var/cache/nginx/jabali levels=1:2 keys_zone=jabali_fcgi:64m max_size=4g inactive=1440m use_temp_path=off;

# GH #610: classify the query string so the micro-cache can serve
# marketing-tracking-ONLY URLs (utm_*, gclid, fbclid, …) from the clean-URL
# cache entry instead of bypassing every query string. STRICT allowlist — a
# query containing ANY param not listed here (e.g. ?p=, ?s=, ?product_cat=,
# pagination) classifies as "other" and still bypasses, so a content-affecting
# param is never served the wrong (query-less) page. The per-domain vhost gate
# bypasses only when $jabali_qs_kind = other, and uses a path-only cache key so
# all tracking variants collapse onto one entry. Case-insensitive.
map $query_string $jabali_qs_kind {
    default other;
    ""      empty;
    "~*^(?:(?:utm_[a-z]+|gclid|gbraid|wbraid|dclid|gclsrc|fbclid|msclkid|yclid|ttclid|twclid|igshid|mc_cid|mc_eid|_ga|_gl|mtm_[a-z]+|pk_[a-z]+|hsa_[a-z]+|_hsenc|_hsmi)=[^&]*)(?:&(?:utm_[a-z]+|gclid|gbraid|wbraid|dclid|gclsrc|fbclid|msclkid|yclid|ttclid|twclid|igshid|mc_cid|mc_eid|_ga|_gl|mtm_[a-z]+|pk_[a-z]+|hsa_[a-z]+|_hsenc|_hsmi)=[^&]*)*$" tracking;
}

# Codeberg #5: the cache key + gate MUST use the ORIGINAL request path, never
# $uri. try_files rewrites $uri to /index.php, so every WordPress permalink on a
# domain collapses onto ONE cache entry (wrong page served to users + Googlebot;
# targeted purge silently broken). $request_uri is the original (pre-rewrite)
# request including the query; strip the query so tracking-param variants still
# collapse onto one entry (preserving the GH #610 intent). Empty $request_uri
# falls back to itself.
map $request_uri $jabali_cache_path {
    ~^(?<jcp>[^?]*)  $jcp;
    default          $request_uri;
}

# GH #637: honor the BACKEND's own cache opt-out. The per-domain micro-cache
# gate ($jabali_skip) is cookie/URL based only — it never inspects the FastCGI
# response, so a PHP page that sends `Cache-Control: no-cache|no-store|private`
# (live/status/diagnostic/webhook endpoints) was still STORED and served stale,
# masking live state. fastcgi_no_cache is evaluated AFTER the upstream responds,
# so it can read $upstream_http_cache_control here; any opt-out directive => 1
# => do not store. Word-boundary anchored so a stray substring can't trip it.
map $upstream_http_cache_control $jabali_upstream_nocache {
    default 0;
    "~*\b(no-cache|no-store|private)\b" 1;
}

# GH #642: respect an upstream Vary header. A response that varies on request
# headers (cookies, auth, language, UA) must NOT be served from one cached
# variant. Vary: Accept-Encoding is safe (nginx serves by content-encoding), so
# cache those; any other Vary opts the response out of the cache.
map $upstream_http_vary $jabali_vary_nocache {
    default 1;
    "" 0;
    "~*^\s*Accept-Encoding\s*$" 0;
}

# GH #617: minimal per-request cache-status log so the panel can tally
# HIT/MISS/BYPASS/EXPIRED/STALE. One token per line, buffered by the vhost.
log_format jcache '$upstream_cache_status';
