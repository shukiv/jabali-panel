# GH #1146 — per-IP rate-limit zone for the WebDAV endpoint (/dav/ on the panel
# :8443 vhost). http{} scope (installed to /etc/nginx/conf.d/), referenced by the
# `limit_req zone=jabali_webdav` directive in the panel vhost.
#
# This is the OUTER flood cap. The real brute-force defense is the jabali-webdav
# authenticator's per-username token bucket (a correct password is refunded, so
# legit clients are unthrottled) plus its bounded-concurrency yescrypt verifies;
# this zone additionally caps an attacker spraying many usernames from one IP,
# which per-username buckets alone would not catch. 15r/s + burst 30 is generous
# for interactive WebDAV (many small PROPFIND/GET requests) while still bounding
# a flood. 10m holds ~160k distinct client IPs.
limit_req_zone $binary_remote_addr zone=jabali_webdav:10m rate=15r/s;
