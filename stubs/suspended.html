<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Suspended</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; max-width: 480px; padding: 2rem; }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; color: #f8fafc; }
        p { font-size: 1.1rem; line-height: 1.6; color: #94a3b8; }
        .icon { font-size: 3rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#9888;</div>
        <h1>This Site Has Been Suspended</h1>
        <p>This website is currently unavailable. If you are the owner of this site, please contact your hosting provider for assistance.</p>
    </div>
</body>
</html>
