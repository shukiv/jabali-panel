# ---------------------------------------------------------------- security ---
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: jat_…
      description: |
        Per-user token minted via POST /me/api-tokens. Send as
        `Authorization: Bearer jat_<43-char base64url>`.
    KratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: Browser cookie from /login. Same-origin only.
  schemas:
    EgressDestination:
      type: object
      properties:
        cidr: { type: string, example: 203.0.113.0/24 }
        port: { type: integer, nullable: true, example: 443 }
        protocol: { type: string, enum: [tcp, udp], example: tcp }
        comment: { type: string }
    EgressPolicy:
      type: object
      properties:
        user_id: { type: string, format: ulid }
        state: { type: string, enum: [off, learning, enforced] }
        allowed_extra:
          type: array
          items: { $ref: "#/components/schemas/EgressDestination" }
        drop_count_24h: { type: integer }
    EgressPolicyInput:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [off, learning, enforced] }
        allowed_extra:
          type: array
          items: { $ref: "#/components/schemas/EgressDestination" }
    EgressRequestInput:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string, example: 203.0.113.10/32 }
        port: { type: integer, nullable: true }
        protocol: { type: string, enum: [tcp, udp] }
        reason: { type: string }
    EgressMatureResult:
      type: object
      properties:
        soak_days: { type: integer }
        dry_run: { type: boolean }
        pinned: { type: boolean }
        pin_value: { type: string }
        eligible_count: { type: integer }
        eligible:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: ulid }
              learning_started_at: { type: string, format: date-time, nullable: true }
              age_days: { type: integer }
              drop_count_24h: { type: integer }
        flipped:
          type: array
          items: { type: string, format: ulid }
        flipped_count: { type: integer }
    DockerApp:
      type: object
      properties:
        id: { type: string, format: ulid }
        slug: { type: string, example: onlyoffice }
        name: { type: string }
        status: { type: string, enum: [installing, running, stopped, failed] }
        domain_id: { type: string, format: ulid, nullable: true }
    PythonApp:
      type: object
      properties:
        id: { type: string, format: ulid }
        name: { type: string }
        runtime_version: { type: string, example: "3.12" }
        status: { type: string, enum: [installing, running, stopped, failed] }
    User:
      type: object
      properties:
        id: { type: string, format: ulid }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        name_first: { type: string }
        name_last: { type: string }
        is_admin: { type: boolean }
        package_id: { type: string, nullable: true }
        linux_uid: { type: integer, nullable: true }
        suspended: { type: boolean }
        webmail_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password: { type: string, format: password }
        name_first: { type: string }
        name_last: { type: string }
        is_admin: { type: boolean }
        package_id: { type: string }
    Database:
      type: object
      properties:
        id: { type: string, format: ulid }
        user_id: { type: string, format: ulid }
        name: { type: string, example: myapp_db }
        engine: { type: string, enum: [mariadb, postgres] }
        charset: { type: string }
        collation: { type: string }
        created_at: { type: string, format: date-time }
    BackupJob:
      type: object
      properties:
        id: { type: string, format: ulid }
        user_id: { type: string, format: ulid, nullable: true }
        destination_id: { type: string, format: ulid }
        schedule_id: { type: string, format: ulid, nullable: true }
        run_id: { type: string, nullable: true }
        kind: { type: string, example: user }
        status: { type: string, enum: [queued, running, success, failed, cancelled] }
        snapshot_id: { type: string, nullable: true }
        bytes_added: { type: integer }
        bytes_total: { type: integer }
        error_text: { type: string, nullable: true }
        source_hostname: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    BackupDestination:
      type: object
      properties:
        id: { type: string, format: ulid }
        name: { type: string }
        kind: { type: string, enum: [sftp, s3, b2, local] }
        url: { type: string }
        enabled: { type: boolean }
        password_rotated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BackupSchedule:
      type: object
      properties:
        id: { type: string, format: ulid }
        kind: { type: string }
        user_id: { type: string, format: ulid, nullable: true }
        cron_expr: { type: string, example: "0 3 * * *" }
        enabled: { type: boolean }
        keep_daily: { type: integer }
        keep_weekly: { type: integer }
        keep_monthly: { type: integer }
        last_run_at: { type: string, format: date-time, nullable: true }
        next_run_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MigrationJob:
      type: object
      properties:
        id: { type: string, format: ulid }
        batch_id: { type: string, format: ulid, nullable: true }
        source_kind: { type: string, enum: [cpanel, whm_pkgacct, directadmin, hestiacp, plesk, imap] }
        mode: { type: string, enum: [live, offline] }
        source_host: { type: string }
        source_user: { type: string }
        dest_user: { type: string, nullable: true }
        dest_domain: { type: string, nullable: true }
        target_user_id: { type: string, format: ulid, nullable: true }
        state: { type: string, enum: [draft, pending, analyzing, fix_perms, validating, restoring, done, degraded, failed, cancelled] }
        last_error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MigrationStage:
      type: object
      properties:
        id: { type: string, format: ulid }
        job_id: { type: string, format: ulid }
        stage_name: { type: string }
        state: { type: string }
        bytes_processed: { type: integer }
        last_error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string, example: invalid_token }
        message: { type: string, example: "API token is invalid, revoked, or expired" }
    DNSRecord:
      type: object
      required: [id, zone_id, name, type, content, ttl, is_enabled]
      properties:
        id:          { type: string, format: ulid, example: 01KT5… }
        zone_id:     { type: string, format: ulid }
        name:        { type: string, example: vpn, description: "Relative to zone apex; '@' = apex" }
        type:        { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS], example: A }
        content:     { type: string, example: 203.0.113.5 }
        ttl:         { type: integer, minimum: 60, maximum: 604800, example: 3600 }
        priority:    { type: integer, default: 0 }
        is_enabled:  { type: boolean, default: true }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    DNSRecordCreate:
      type: object
      required: [name, type, content]
      properties:
        name:    { type: string, example: vpn }
        type:    { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS] }
        content: { type: string, example: 203.0.113.5 }
        ttl:     { type: integer, example: 3600, description: "Omit to use server-wide default (Server Settings → DNS)." }
        priority: { type: integer }
    Domain:
      type: object
      required: [id, user_id, name, is_enabled]
      properties:
        id:         { type: string, format: ulid }
        user_id:    { type: string, format: ulid }
        name:       { type: string, example: example.com }
        is_enabled: { type: boolean }
        email_enabled: { type: boolean }
        ssl_enabled: { type: boolean }
        doc_root:    { type: string }
        php_version: { type: string, example: "8.4" }
        created_at:  { type: string, format: date-time }
    Mailbox:
      type: object
      required: [id, domain_id, local_part, quota_mb]
      properties:
        id:         { type: string, format: ulid }
        domain_id:  { type: string, format: ulid }
        local_part: { type: string, example: alice }
        email:      { type: string, example: alice@example.com, readOnly: true }
        quota_mb:   { type: integer, example: 1024 }
        created_at: { type: string, format: date-time }
    UserAPIToken:
      type: object
      required: [id, user_id, name, secret_last4, created_at]
      properties:
        id:           { type: string, format: ulid }
        user_id:      { type: string, format: ulid }
        name:         { type: string, example: "office router DDNS" }
        secret_last4: { type: string, example: aB9c, description: "Last 4 chars of plaintext for UI disambiguation." }
        scopes:
          type: array
          items: { type: string, example: "dns:*" }
          nullable: true
          description: "null = full per-user access. Wildcard supported (dns:* matches dns:read + dns:write)."
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip: { type: string, nullable: true }
        expires_at:   { type: string, format: date-time, nullable: true }
        revoked_at:   { type: string, format: date-time, nullable: true }
        created_at:   { type: string, format: date-time }
    UserAPITokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "office router DDNS", maxLength: 100 }
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 31536000
          description: "Optional. Omit for an infinite-lifetime API key. Capped at 1 year."
        scopes:
          type: array
          items: { type: string }
          description: "Optional. Omit for full per-user access. Wildcard supported."
    UserAPITokenMintResponse:
      type: object
      required: [token, secret]
      properties:
        token:  { $ref: "#/components/schemas/UserAPIToken" }
        secret: { type: string, example: jat_aBc…XyZ, description: "Plaintext bearer token. Shown ONCE." }

security:
  - BearerToken: []
  - KratosSession: []

# -------------------------------------------------------------------- paths ---
paths:

  /me/api-tokens:
    get:
      tags: [API Tokens]
      summary: List your API tokens
      description: |
        Returns every token (active + revoked) the calling user owns,
        newest first. SecretHash is never returned; SecretLast4 is shown
        for UI disambiguation.

        **Auth:** browser session ONLY. Token-authed callers get 403
        (defense-in-depth — a leaked token cannot enumerate or mint
        siblings).
      security:
        - KratosSession: []
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserAPIToken" }
        "403": { description: Token-authed request rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [API Tokens]
      summary: Mint a new API token
      description: |
        Generates a 256-bit secret + returns it ONCE alongside the token
        metadata. The plaintext is never persisted; the panel only keeps
        a SHA-256 hash.

        **Auth:** browser session ONLY.
      security:
        - KratosSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAPITokenCreate" }
      responses:
        "201":
          description: Token created — secret in response, copy it now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAPITokenMintResponse" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/api-tokens/{id}:
    delete:
      tags: [API Tokens]
      summary: Revoke a token
      description: |
        Sets revoked_at = now(). Subsequent Bearer requests using this
        token return 401. Already-revoked tokens are no-op.

        **Auth:** browser session ONLY.
      security:
        - KratosSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: ulid }
      responses:
        "204": { description: Revoked }
        "404": { description: No such token (or owned by another user) }

  # ----------------------------------------------------------------- DNS ---

  /domains/{id}/dns/records:
    get:
      tags: [DNS]
      summary: List records in a zone
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSRecord" }
    post:
      tags: [DNS]
      summary: Create a record
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordCreate" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecord" } } }
        "400": { description: Validation error }
        "404": { description: Domain not owned by caller }

  /dns/records/{id}:
    patch:
      tags: [DNS]
      summary: Update a record
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, example: 203.0.113.99 }
                ttl:     { type: integer }
                priority: { type: integer }
                is_enabled: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecord" } } } }
    delete:
      tags: [DNS]
      summary: Delete a record
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "204": { description: Deleted }

  # ---------------------------------------------------------------- DDNS ---

  /nic/update:
    get:
      tags: [DDNS]
      summary: DynDNS v2 — update an A/AAAA record
      description: |
        Speaks the de-facto DynDNS protocol every router firmware
        (OpenWrt, Mikrotik, pfSense, Ubiquiti, ddclient, inadyn) already
        knows. Wraps the same per-user Bearer token in HTTP Basic-auth
        so existing DDNS clients can update records without a custom
        scripting integration.

        **Path:** mounted at the engine root, NOT under /api/v1, because
        every router hardcodes /nic/update.

        **Auth:** HTTP Basic. The username half is ignored (routers
        require it as input but the panel uses only the password). The
        password is your `jat_…` token.

        **myip:** omit to use the client's source IP (X-Real-IP /
        X-Forwarded-For / RemoteAddr).

        **Hostname:** must be a fully-qualified domain name. The panel
        does longest-suffix match against your owned domains to find
        the zone + record.
      servers:
        - url: https://{panel-hostname}:8443
          variables: { panel-hostname: { default: jabali-panel.local } }
      security:
        - BasicAuth: []
      parameters:
        - in: query
          name: hostname
          required: true
          schema: { type: string, example: vpn.example.com }
          description: FQDN of the record to update.
        - in: query
          name: myip
          schema: { type: string, example: 203.0.113.5 }
          description: New IP. Omit to use the request's source IP.
      responses:
        "200":
          description: |
            Text/plain single-line response — one of:
            - `good 1.2.3.4` — record updated
            - `nochg 1.2.3.4` — record already pointed at that IP
          content:
            text/plain:
              schema: { type: string, example: "good 1.2.3.4\n" }
        "400":
          description: "Malformed hostname or IP. Body: `notfqdn`."
          content: { text/plain: { schema: { type: string, example: "notfqdn\n" } } }
        "401":
          description: "Missing or invalid Basic auth. Body: `badauth`."
          content: { text/plain: { schema: { type: string, example: "badauth\n" } } }
        "404":
          description: "Hostname doesn't resolve to a record you own. Body: `nohost`."
          content: { text/plain: { schema: { type: string, example: "nohost\n" } } }
    post:
      tags: [DDNS]
      summary: DynDNS v2 — same as GET (some routers POST)
      description: Some router firmware sends POST instead of GET; semantics identical.
      security: [ { BasicAuth: [] } ]
      responses:
        "200": { description: See GET }

  # ------------------------------------------------------------- Domains ---

  /domains:
    get:
      tags: [Domains]
      summary: List your domains
      responses:
        "200":
          description: Domains owned by the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Domain" }
    post:
      tags: [Domains]
      summary: Add a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: example.com }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }

  /domains/{id}:
    get:
      tags: [Domains]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } } }
    patch:
      tags: [Domains]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Updated } }
    delete:
      tags: [Domains]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  # ----------------------------------------------------------- Mailboxes ---

  /domains/{id}/mailboxes:
    get:
      tags: [Mailboxes]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses:
        "200":
          description: Mailboxes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
    post:
      tags: [Mailboxes]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_part, password, quota_mb]
              properties:
                local_part: { type: string, example: alice }
                password:   { type: string, format: password, minLength: 12 }
                quota_mb:   { type: integer, example: 1024 }
      responses:
        "201": { description: Created }

  /mailboxes/{id}:
    delete:
      tags: [Mailboxes]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  /mailboxes/{id}/password:
    put:
      tags: [Mailboxes]
      summary: Change mailbox password
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 12 }
      responses: { "204": { description: Changed } }

  # -------------------------------------------------------- Forwarders ---

  /domains/{id}/forwarders:
    get:
      tags: [Mailbox Forwarders]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK } }
    post:
      tags: [Mailbox Forwarders]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, dest]
              properties:
                source: { type: string, example: sales@example.com }
                dest:   { type: string, example: alice@example.com }
      responses: { "201": { description: Created } }

  # ------------------------------------------------------- Applications ---

  /applications:
    get:
      tags: [Applications]
      summary: List installed apps
      responses: { "200": { description: OK } }
    post:
      tags: [Applications]
      summary: Install an app (WordPress, Joomla, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id, kind]
              properties:
                domain_id: { type: string, format: ulid }
                kind:      { type: string, enum: [wordpress, joomla, drupal, moodle, ghost, opencart, prestashop, magento, drupal10, mediawiki, nextcloud, mautic, suitecrm, dolibarr, processmaker] }
                path:      { type: string, default: "/", description: "Install path under doc-root." }
      responses: { "201": { description: "Install started — poll /applications/{id} for status" } }

  # ----------------------------------------------------------- Backups ---

  /me/backups:
    get:
      tags: [Backups]
      summary: List your snapshots
      responses: { "200": { description: OK } }
    post:
      tags: [Backups]
      summary: Trigger an on-demand backup
      responses: { "202": { description: Job queued } }

  /me/backups/destinations:
    get:
      tags: [Backups]
      summary: List backup destinations your hosting plan allows
      responses: { "200": { description: OK } }

  /me/backups/exclusions:
    get:
      tags: [Backups]
      summary: Your backup exclude patterns (~/.backupignore)
      responses: { "200": { description: OK } }
    put:
      tags: [Backups]
      summary: Set your backup exclude patterns (~/.backupignore)
      responses: { "200": { description: OK } }

  /me/backup-schedule:
    get:
      tags: [Backups]
      summary: Your scheduled-backup settings (admin owns the time)
      responses: { "200": { description: OK } }
    put:
      tags: [Backups]
      summary: Set your scheduled-backup content, destination, and on/off
      responses: { "200": { description: OK } }

  /me/backup-schedules:
    get:
      tags: [Backups]
      summary: List your backup schedules (multi-schedule plans) + the admin window
      responses: { "200": { description: OK } }
    post:
      tags: [Backups]
      summary: Create a backup schedule (content, cadence, destination, retention)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, cadence]
              properties:
                enabled:        { type: boolean }
                content:        { type: string, enum: [full, files, database, folders] }
                cadence:        { type: string, enum: [hourly, every_6h, every_12h, daily, weekly] }
                destination_id: { type: string, format: ulid }
                keep_daily:     { type: integer, nullable: true }
      responses:
        "201": { description: Created }
        "403": { description: Cap reached or content/destination not allowed by your plan }

  /me/backup-schedules/{id}:
    put:
      tags: [Backups]
      summary: Update one of your backup schedules
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses:
        "200": { description: OK }
        "404": { description: Not found or not yours }
    delete:
      tags: [Backups]
      summary: Delete one of your backup schedules
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses:
        "200": { description: OK }
        "404": { description: Not found or not yours }

  /me/backups/{id}/restore:
    post:
      tags: [Backups]
      summary: Restore a snapshot
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: Restore queued } }

  # --------------------------------------------------------- Databases ---

  /databases:
    get:
      tags: [Databases]
      summary: List my databases
      security: [ { KratosSession: [] } ]
      responses:
        "200":
          description: The databases
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Database" } } } }
    post:
      tags: [Databases]
      summary: Create a database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, engine]
              properties:
                name:   { type: string, example: myapp_prod }
                engine: { type: string, enum: [mysql, postgres] }
      responses: { "201": { description: Created } }

  # ---------------------------------------------------------- Admin: Users ---

  /admin/users:
    get:
      tags: [Users]
      summary: List all panel users (admin)
      responses: { "200": { description: OK } }
    post:
      tags: [Users]
      summary: Create a tenant user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                is_admin: { type: boolean, default: false }
      responses: { "201": { description: Created } }

  # ----------------------------------------------- Admin: Server Settings ---

  /admin/settings/free-hostname/register:
    post:
      tags: [Server Settings]
      summary: Request a free jabalihosted.com hostname verification code (admin, JAB-213)
      description: |
        Proxies to the Jabali free-hostname service, which emails a 6-digit
        code. The panel box's observed public IP becomes the hostname label
        at claim time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200": { description: Code sent }
        "422": { description: Invalid email }
        "429": { description: Rate limited }
        "502": { description: Hostname service unreachable }
  /admin/settings/free-hostname/claim:
    post:
      tags: [Server Settings]
      summary: Claim a free jabalihosted.com hostname with the emailed code (admin, JAB-213)
      description: |
        Verifies the code, persists the relay credential (agent), and switches
        the panel hostname to <label>.jabalihosted.com.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code:  { type: string }
      responses:
        "200": { description: "Claimed; body carries fqdn" }
        "422": { description: "code_invalid / code_attempts / bad_source" }
        "502": { description: Hostname service unreachable }
  /admin/settings/cloudflare-token:
    get:
      tags: [Server Settings]
      summary: Whether a Cloudflare API token is configured for the DNS-01 fallback (admin, JAB-235)
      description: |
        Reports configured yes/no only — the token itself is sealed at rest
        (sso.key AES-256-GCM) and never returned by any endpoint.
      responses:
        "200": { description: "{ configured: bool }" }
    put:
      tags: [Server Settings]
      summary: Store the Cloudflare API token behind the ACME DNS-01 fallback (admin, JAB-235)
      description: |
        Verifies the token against Cloudflare (/user/tokens/verify) before
        storing it sealed. The token needs Zone:DNS:Edit + Zone:Read on the
        customer zones it should cover; a dedicated scoped token is advised.
        The response reports how many zones the token can see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: "{ configured: true, zones: n }" }
        "422": { description: Cloudflare rejected the token }
        "503": { description: sso.key unavailable — cannot store securely }
    delete:
      tags: [Server Settings]
      summary: Clear the stored Cloudflare API token (admin, JAB-235)
      responses:
        "200": { description: "{ configured: false }" }
  /admin/settings:
    get:
      tags: [Server Settings]
      summary: Read server-wide settings (admin)
      responses: { "200": { description: ServerSettings JSON } }
    patch:
      tags: [Server Settings]
      summary: Update server-wide settings (admin)
      description: |
        Partial update — only fields present in the body are applied. Fields:
        hostname, public_ipv4, public_ipv6, ns1_*, ns2_*, admin_email,
        timezone, ssh_port, ssh_password_auth, default_dns_ttl, …
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                default_dns_ttl:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  description: "Server-wide default TTL for new DNS records (seconds)."
      responses: { "200": { description: Updated } }

  # ------------------------------------------------------- Admin: Updates ---

  /admin/updates/run:
    post:
      tags: [Updates]
      summary: Trigger `jabali update` (admin)
      description: |
        Spawns a transient systemd unit that runs the update flow
        (download release tarball or build from source, run migrations,
        restart services). Returns immediately with a job handle.
      responses: { "202": { description: Job queued — stream logs via WebSocket } }


  # -------------------------------------------------------------- Egress ---

  /me/egress:
    get:
      tags: [Egress]
      summary: Get my egress policy
      description: |
        The caller's per-user egress firewall policy: state (off / learning /
        enforced), allowed-extra destinations, and 24h drop count.

        **Auth:** browser session.
      security:
        - KratosSession: []
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressPolicy" }

  /me/egress/requests:
    get:
      tags: [Egress]
      summary: List my pending egress requests
      description: "Destinations the caller has requested be allowed. **Auth:** browser session."
      security:
        - KratosSession: []
      responses:
        "200": { description: "{ data: [EgressRequest], total }" }

  /me/egress/request:
    post:
      tags: [Egress]
      summary: Request a destination be allowed
      description: "Files a request for an admin to approve (CIDR + optional port/protocol + reason). **Auth:** browser session."
      security:
        - KratosSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressRequestInput" }
      responses:
        "201": { description: Request filed }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/egress/requests/{id}:
    delete:
      tags: [Egress]
      summary: Cancel my pending egress request
      description: "Cancels a still-pending request the caller filed. **Auth:** browser session."
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "204": { description: Cancelled }
        "404": { description: No such pending request owned by the caller }

  /admin/users/{id}/egress:
    get:
      tags: [Egress]
      summary: Get a user's egress policy (admin)
      description: "**Auth:** admin browser session."
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressPolicy" }
    put:
      tags: [Egress]
      summary: Set a user's egress policy (admin)
      description: |
        Sets the state (off / learning / enforced) and allowed-extra list. The
        reconciler re-renders nftables on its next tick. **Auth:** admin session.
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressPolicyInput" }
      responses:
        "200": { description: Updated }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/egress-requests:
    get:
      tags: [Egress]
      summary: List pending egress requests (admin queue)
      description: "**Auth:** admin browser session."
      security:
        - KratosSession: []
      responses:
        "200": { description: "{ data: [EgressRequest], total }" }

  /admin/egress-requests/{id}/approve:
    post:
      tags: [Egress]
      summary: Approve an egress request (admin)
      description: "Approves the request and folds its destination into the user's policy. **Auth:** admin session."
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200": { description: Approved }
        "409": { description: Already decided }

  /admin/egress-requests/{id}/deny:
    post:
      tags: [Egress]
      summary: Deny an egress request (admin)
      description: "**Auth:** admin browser session."
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200": { description: Denied }
        "409": { description: Already decided }

  /admin/egress-summary:
    get:
      tags: [Egress]
      summary: Egress fleet summary (admin)
      description: "Per-state user counts + total 24h drops, for the admin dashboard. **Auth:** admin session."
      security:
        - KratosSession: []
      responses:
        "200": { description: "{ state_counts, total_drops, policy_total }" }

  /admin/users/{id}/egress/drops-24h:
    get:
      tags: [Egress]
      summary: A user's 24h drop sparkline (admin)
      description: "Hourly egress-drop buckets over the last 24h. **Auth:** admin session."
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200": { description: "{ buckets: [{ at, drops }] }" }
        "503": { description: Drop-sample store unavailable }

  /admin/users/{id}/egress/drop-events:
    get:
      tags: [Egress]
      summary: A user's recent drop events (admin drill-down)
      description: "Recent per-drop events read from the nft drop log via the agent. **Auth:** admin session."
      security:
        - KratosSession: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200": { description: "{ source, events: [...] }" }

  /admin/egress/mature-preview:
    get:
      tags: [Egress]
      summary: Dry-run mature-soak promotion (admin)
      description: |
        Lists LEARNING policies mature enough to graduate to ENFORCED at the given
        soak window, with each user's soak age + 24h drop count, plus whether the
        operator pin blocks promotion. Read-only. **Auth:** admin session.
      security:
        - KratosSession: []
      parameters:
        - { in: query, name: soak_days, required: false, schema: { type: integer, default: 7, minimum: 1 } }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressMatureResult" }

  /admin/egress/flip-mature:
    post:
      tags: [Egress]
      summary: Promote mature LEARNING policies to ENFORCED (admin)
      description: |
        Flips every LEARNING policy past the soak window to ENFORCED. No-op when
        the operator pin (/etc/jabali/per-user-egress.mode = learning) is set.
        **Auth:** admin session.
      security:
        - KratosSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                soak_days: { type: integer, default: 7, minimum: 1 }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressMatureResult" }

  # --------------------------------------------------------------- Audit ---

  /admin/audit:
    get:
      tags: [Audit]
      summary: Query the audit log (admin)
      description: "Filterable, paginated audit events. **Auth:** admin browser session."
      security: [ { KratosSession: [] } ]
      responses:
        "200": { description: "{ data: [AuditEvent], total }" }

  /admin/audit/verify:
    post:
      tags: [Audit]
      summary: Verify the audit hash chain (admin)
      description: "Recomputes the tamper-evidence chain (from the retention anchor, JAB-105). **Auth:** admin session."
      security: [ { KratosSession: [] } ]
      responses:
        "200": { description: "{ ok, checked, total, broken_id }" }

  /admin/audit/prune:
    post:
      tags: [Audit]
      summary: Prune old audit rows (admin)
      description: |
        Deletes rows older than --days and re-anchors the chain so verify still
        passes (JAB-105). The prune is itself audited. **Auth:** admin session.
      security: [ { KratosSession: [] } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { days: { type: integer, default: 365, minimum: 1 } } }
      responses:
        "200": { description: "{ pruned, cutoff }" }

  # ---------------------------------------------------------- Docker Apps ---

  /admin/docker-apps:
    get:
      tags: [Docker Apps]
      summary: List installed Docker apps (admin)
      security: [ { KratosSession: [] } ]
      responses:
        "200":
          description: The installs
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DockerApp" } } } }
    post:
      tags: [Docker Apps]
      summary: Install a catalog Docker app (admin)
      description: "Provisions a compose app from the catalog. Long-running → 202 + job. **Auth:** admin session."
      security: [ { KratosSession: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { slug: { type: string }, domain_id: { type: string } } } } } }
      responses:
        "202": { description: Install queued }

  /admin/docker-apps/catalog:
    get:
      tags: [Docker Apps]
      summary: List the Docker app catalog (admin)
      security: [ { KratosSession: [] } ]
      responses: { "200": { description: Catalog entries } }

  /admin/docker-apps/catalog/{slug}/icon:
    get:
      tags: [Docker Apps]
      summary: Catalog app icon (admin)
      security: [ { KratosSession: [] } ]
      parameters: [ { in: path, name: slug, required: true, schema: { type: string } } ]
      responses: { "200": { description: SVG/PNG icon }, "404": { description: No icon } }

  /admin/docker-apps/engine/status:
    get:
      tags: [Docker Apps]
      summary: Docker engine status (admin)
      security: [ { KratosSession: [] } ]
      responses: { "200": { description: "{ installed, running }" } }

  /admin/docker-apps/maintenance/disk-usage:
    get:
      tags: [Docker Apps]
      summary: Docker disk usage (admin)
      security: [ { KratosSession: [] } ]
      responses: { "200": { description: Disk usage breakdown } }

  /admin/docker-apps/maintenance/prune:
    post:
      tags: [Docker Apps]
      summary: Prune dangling Docker images/volumes (admin)
      security: [ { KratosSession: [] } ]
      responses: { "200": { description: Reclaimed space } }

  /admin/docker-apps/{id}:
    get:
      tags: [Docker Apps]
      summary: Get a Docker app (admin)
      security: [ { KratosSession: [] } ]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: The install, content: { application/json: { schema: { $ref: "#/components/schemas/DockerApp" } } } }, "404": { description: Not found } }
    patch:
      tags: [Docker Apps]
      summary: Update a Docker app's config (admin)
      security: [ { KratosSession: [] } ]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Updated } }
    delete:
      tags: [Docker Apps]
      summary: Uninstall a Docker app (admin)
      security: [ { KratosSession: [] } ]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Removed } }

  /admin/docker-apps/{id}/logs:
    get:
      tags: [Docker Apps]
      summary: Docker app logs (admin)
      security: [ { KratosSession: [] } ]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Log snapshot } }

  /admin/docker-apps/{id}/env:
    get:
      tags: [Docker Apps]
      summary: Get a Docker app's env (admin)
      security: [ { KratosSession: [] } ]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Env map } }
    put:
