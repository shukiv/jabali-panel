# Nightly full-suite run — the daily safety net for the PR gate. Runs the whole
# suite unconditionally + the slow/advisory checks kept off the PR path
# (npm audit). Ported to GitHub Actions with the source-of-truth move.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# JAB-247 follow-up: nightly only builds/tests and uploads artifacts —
# read-only token is sufficient.
permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "20"

jobs:
  go:
    name: Go tests + vet (race)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: make vet
      - run: make test

  ui-unit:
    name: panel-ui unit tests (vitest)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      - run: cd panel-ui && npm run lint
      - run: cd panel-ui && npm test

  e2e:
    name: Playwright E2E (full)
    runs-on: self-hosted
    concurrency:
      group: e2e-port-4173
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      - run: cd panel-ui && npx playwright install chromium
      - run: cd panel-ui && npm run build
      - name: Free port 4173
        run: |
          pkill -9 -f "vite preview" 2>/dev/null || true
          for i in $(seq 1 10); do
            ss -tln | grep -q ":4173 " || break
            sleep 1
          done
          if ss -tln | grep -q ":4173 "; then
            echo "ERROR: port 4173 still in use after kill + 10s wait"
            exit 1
          fi
      - run: cd panel-ui && npx playwright test --project=chromium --reporter=list
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-playwright-report
          path: |
            panel-ui/test-results/
            panel-ui/playwright-report/
          retention-days: 7

  audit:
    name: npm audit (advisory)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        continue-on-error: true
        run: cd panel-ui && npm audit --omit=dev || true
