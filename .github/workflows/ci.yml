# GitHub Actions CI — gate every PR against the test suite. Ported from the
# retired Codeberg/Forgejo workflow when the project moved its source-of-truth
# to GitHub (shukiv/jabali-panel).
#
# JAB-238: PR CI runs on GITHUB-HOSTED runners (ubuntu-latest), NOT the
# self-hosted box. This workflow executes arbitrary code from any fork PR,
# and the repo is public — on a self-hosted runner that is remote code
# execution on our own infrastructure, and a poisoned runner then persists
# into the trusted release.yml/nightly jobs that share the box. Ephemeral
# GitHub-hosted runners make every PR run single-use and isolated. The
# self-hosted runner is reserved for the trusted, maintainer-only triggers:
# push-to-main (release.yml), schedule (nightly.yml), and workflow_dispatch
# utilities.
#
# Jobs (all run unconditionally): Go tests+vet, install.sh lint, vitest+eslint,
# Playwright E2E.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-ref concurrency: PR pushes auto-supersede stale in-flight runs; main runs
# always run to completion (each commit is an authoritative green/red record).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  go:
    name: Go tests + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: true — ephemeral GitHub-hosted runners start cold every
          # run (JAB-238); the tar-layer conflict noted here historically
          # was specific to the self-hosted box's persistent $GOMODCACHE.
          cache: true
      - name: go vet
        run: make vet
      - name: go test -race
        run: make test

  govulncheck:
    name: govulncheck (Go stdlib + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # JAB-185. Nothing in CI reported the dependency surface before this, so a
      # stale toolchain or a vulnerable module could ship unnoticed -- the manual
      # 2026-07-31 run found 32 reachable advisories against the go.mod floor,
      # including archive/tar reachable from migration restore and encoding/pem
      # reachable from SSL cert upload.
      #
      # continue-on-error while the backlog is worked down: the report is the
      # point, and a red build on day one just trains people to ignore it. Flip
      # this to a hard gate once the run is clean (tracked in JAB-185).
      - name: govulncheck
        continue-on-error: true
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1 | tee govulncheck.txt
      - name: Summarise
        if: always()
        run: |
          {
            echo '### govulncheck'
            echo
            if grep -q 'No vulnerabilities found' govulncheck.txt 2>/dev/null; then
              echo 'No known vulnerabilities.'
            else
              echo '```'
              grep -E '^Vulnerability #|^    [A-Z]|Found in:|Fixed in:' govulncheck.txt 2>/dev/null \
                | grep -vE 'Example traces|More info' | head -100
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  install-sh-lint:
    name: install.sh phantom-function lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: tools/lint-install-sh.sh

  install-sh-tests:
    name: install.sh regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install/tests
        # These are per-incident regression guards (OOM sizing, /etc/hosts
        # loopback shadow, pdns upstream, socket helpers). They existed but
        # were never wired into CI, so two of them sat red on main for weeks
        # while asserting nothing. A guard nobody runs is not a guard.
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for t in install/tests/*.sh; do
            echo "::group::$(basename "$t")"
            if bash "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$(basename "$t") failed"
              failed=1
            fi
          done
          exit "$failed"

  pinned-downloads:
    name: install.sh pinned downloads published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned versions resolve to published artifacts
        # Fails if any pinned third-party version in install.sh is AHEAD of
        # upstream (tagged/not-yet-published) — catches the GH #670 class in the
        # PR that bumps the pin, instead of bricking real installs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-pinned-downloads.sh install.sh

  demo-guard:
    name: demo anti-leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # JAB-159: the security guarantee for merging demo code to main is that a
      # production (untagged) build physically excludes it. Assert the prod
      # binary carries no demo_mode marker while the -tags demo build does, and
      # run the demo write-block test under the demo tag.
      - name: prod build excludes demo, demo build includes it
        run: make demo-guard

  ui-unit:
    name: panel-ui unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install deps
        run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      - name: eslint
        run: cd panel-ui && npm run lint
      - name: vitest
        run: cd panel-ui && npm test
      # Production build gate. vitest uses its own transform and never runs the
      # rollup/vite production build, so a build-only break — e.g. a bumped
      # dep that breaks `monaco-editor/…editor.worker?worker` resolution — passes
      # vitest yet fails the real build (caught only at deploy). The Playwright
      # job does build the SPA, but that job is slower and can be skipped under
      # runner contention; gate the build here too so it fails fast and always.
      - name: build (production)
        run: cd panel-ui && NODE_OPTIONS=--max-old-space-size=4096 npm run build
      # JAB-159 phase 2: the prod SPA (just built above) must not contain the
      # demo UI; a VITE_DEMO=1 build must. `jabali-demo-banner` is a DemoBanner
      # string literal (CSS var + style id) that survives minification.
      - name: demo UI stripped from prod bundle, present in demo build (JAB-159)
        run: |
          cd panel-ui
          if grep -rq 'jabali-demo-' dist/; then echo 'FAIL: demo UI leaked into prod bundle'; exit 1; fi
          VITE_DEMO=1 NODE_OPTIONS=--max-old-space-size=4096 npm run build
          if ! grep -rq 'jabali-demo-' dist/; then echo 'FAIL: demo build missing demo UI'; exit 1; fi
          echo 'SPA demo-gate OK: prod excludes demo UI, demo build includes it'

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Serialize e2e across ALL refs — port 4173 is a host-level resource.
    concurrency:
      group: e2e-port-4173
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install deps
        run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      - name: Install Playwright Chromium
        run: cd panel-ui && npx playwright install chromium
      - name: Build SPA
        run: cd panel-ui && npm run build
      - name: Free port 4173
        run: |
          pgrep -a -f "vite preview" || echo "(none)"
          pkill -9 -f "vite preview" 2>/dev/null || true
          for i in $(seq 1 10); do
            ss -tln | grep -q ":4173 " || break
            sleep 1
          done
          if ss -tln | grep -q ":4173 "; then
            echo "ERROR: port 4173 still in use after kill + 10s wait"
            exit 1
          fi
      - name: Playwright
        run: cd panel-ui && npx playwright test --project=chromium --reporter=list
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            panel-ui/test-results/
            panel-ui/playwright-report/
          retention-days: 7
