name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP — pint, phpstan, phpunit, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, sqlite3
          coverage: none

      - name: Configure Filament auth
        run: composer config http-basic.packages.filamentphp.com "${{ secrets.FILAMENT_USERNAME }}" "${{ secrets.FILAMENT_LICENSE_KEY }}"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run PHPStan (unified monorepo config)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run PHPUnit
        run: php artisan test --compact

      - name: Audit dependencies
        run: composer audit

  python-security:
    name: Python — security/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        run: cd security && uv sync --extra dev
      - name: Run ruff
        run: cd security && uv run ruff check .
      - name: Run pytest
        run: cd security && uv run pytest -q

  python-terminal:
    name: Python — terminal/daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        run: cd terminal/daemon && uv sync --extra dev
      - name: Run ruff
        run: cd terminal/daemon && uv run ruff check .
      - name: Run pytest
        run: |
          if [ -d terminal/daemon/tests ]; then
            cd terminal/daemon && uv run pytest tests -q
          fi

  python-isolator:
    name: Python — isolator/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        run: cd isolator && uv sync --group dev
      - name: Run ruff
        run: cd isolator && uv run ruff check .
      - name: Run pytest
        run: |
          if [ -d isolator/tests ]; then
            cd isolator && uv run pytest -q
          fi

  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck install.sh || true
