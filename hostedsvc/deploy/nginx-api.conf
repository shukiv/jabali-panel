# api.jabalihosted.com — origin vhost, fronted by Cloudflare.
#
# TRUST CHAIN (this is the whole security model when CF fronts the API):
#   client --TLS--> Cloudflare edge --TLS--> this origin
# The service (hostedsvc/realip.go) trusts X-Real-IP only from its loopback
# nginx. This vhost is the nginx that unwraps the real client IP: the real_ip
# module rewrites $remote_addr to CF-Connecting-IP ONLY for connections from
# Cloudflare's published ranges. Cloudflare overwrites any client-supplied
# CF-Connecting-IP, so through the CF-only firewall (below) it is
# unforgeable — preserving "the TCP handshake proves IP control" at the edge.
#
# HARD REQUIREMENTS:
#  * The host firewall (ufw/nftables) must allow :443 ONLY from Cloudflare
#    ranges — otherwise an attacker connects to the origin directly, bypasses
#    CF, and (harmlessly for label integrity, since real_ip then falls back to
#    their true peer IP) but defeats the DDoS/hide-origin purpose.
#  * set_real_ip_from must list the CURRENT Cloudflare ranges. Refresh from
#    https://www.cloudflare.com/ips-v4 + ips-v6 on a cron; stale ranges silently
#    break real-IP unwrap (every registrant becomes a CF edge IP).
#  * NEVER use real_ip_header X-Forwarded-For here.

# --- BEGIN cf-ranges ---
# (refresh-cf-ranges.sh rewrites everything between these markers weekly)
# --- Cloudflare IPv4 ranges (refresh from cloudflare.com/ips-v4) ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# --- Cloudflare IPv6 ranges (refresh from cloudflare.com/ips-v6) ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# --- END cf-ranges ---

server {
    listen 443 ssl;
    http2 on;
    server_name api.jabalihosted.com;

    # Cloudflare Origin CA cert (free, 15-year, trusted by CF only) for the
    # CF->origin hop. CF zone SSL mode = Full (strict). No certbot on this box.
    ssl_certificate     /etc/ssl/jabalihosted/origin.pem;
    ssl_certificate_key /etc/ssl/jabalihosted/origin.key;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8470;
        # $remote_addr is now the true client IP (real_ip unwrapped it from
        # CF-Connecting-IP); the loopback service trusts this X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}
