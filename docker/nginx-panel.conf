# Jabali Panel — Nginx configuration (container)
# HTTP → HTTPS redirect + mail autoconfig

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Mail autoconfig endpoints — proxy to panel
    location = /mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/(autodiscover|Autodiscover)(/.*)?$ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Health check endpoint (no HTTPS redirect)
    location = /up {
        fastcgi_pass unix:/run/php/php8.4-fpm-panel.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/jabali/public/index.php;
        include fastcgi_params;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main panel
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;
    root /var/www/jabali/public;
    index index.php index.html;

    # SSL
    ssl_certificate /etc/ssl/jabali/panel.crt;
    ssl_certificate_key /etc/ssl/jabali/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 512M;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via FPM socket
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm-panel.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    # Block sensitive paths
    location ~ ^/vendor/ { deny all; return 404; }
    location ~ ^/node_modules/ { deny all; return 404; }
    location ~ ^/storage/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }

    # phpMyAdmin and Roundcube location blocks are not included by default.
    # If needed, add them with root (not alias) directives and appropriate
    # access restrictions (e.g. allow/deny or auth_basic).

    # When MAIL_BACKEND=stalwart, enable the Bulwark webmail proxy below
    # and remove/comment the Roundcube alias if present.
    # Bulwark must be built with basePath="/webmail" and localePrefix="always"
    # in next.config.ts / i18n/routing.ts. The = /webmail block proxies the
    # exact path so Bulwark can redirect to /webmail/en (locale prefix).
    # location = /webmail {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location ^~ /webmail/ {
