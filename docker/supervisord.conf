[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mariadb]
command=/usr/bin/mysqld_safe
user=mysql
priority=5
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/mariadb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/mariadb-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf --daemonize no
user=redis
priority=5
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/redis-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/nginx-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:php-fpm]
command=/usr/sbin/php-fpm%(ENV_PHP_VERSION)s --nodaemonize --fpm-config /etc/php/%(ENV_PHP_VERSION)s/fpm/php-fpm-panel.conf
priority=20
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/php-fpm-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:jabali-agent]
command=/usr/bin/php /var/www/jabali/bin/jabali-agent
user=root
priority=30
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/jabali-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/jabali-agent-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:queue-worker]
command=/usr/bin/php /var/www/jabali/artisan queue:work --sleep=3 --tries=1 --timeout=120
directory=/var/www/jabali
user=www-data
priority=40
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/queue-worker-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:cron]
command=/usr/sbin/cron -f
priority=50
autorestart=true
stdout_logfile=/var/log/supervisor/cron.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/cron-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:bind9]
command=/usr/sbin/named -f -u bind
priority=50
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/bind9.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/bind9-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:opendkim]
command=/usr/sbin/opendkim -f
user=opendkim
priority=55
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/opendkim.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/opendkim-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:rspamd]
command=/usr/bin/rspamd --no-fork
user=_rspamd
priority=55
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/rspamd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/rspamd-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:postfix]
command=/usr/sbin/postfix start-fg
priority=60
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/postfix.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/postfix-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:dovecot]
command=/usr/sbin/dovecot -F
priority=60
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/dovecot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/dovecot-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# Stalwart Mail Server (activated when MAIL_BACKEND=stalwart, replaces postfix+dovecot+opendkim+rspamd)
# Note: When MAIL_BACKEND=stalwart, the container-entrypoint.sh disables the legacy programs
[program:stalwart-mail]
command=/usr/local/bin/stalwart-mail --config /etc/stalwart-mail/config.toml
autostart=false
autorestart=true
startretries=3
stdout_logfile=/var/log/stalwart-mail/stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/stalwart-mail/stderr.log
stderr_logfile_maxbytes=10MB
priority=600

[program:fail2ban]
command=/usr/bin/fail2ban-server -xf start
priority=70
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/fail2ban.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/fail2ban-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
